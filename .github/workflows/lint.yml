name: Code quality

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
            - name: Copy /packages/site/.env.example to /packages/site/.env
              run: cp packages/site/.env.example packages/site/.env && cp packages/worker/.dev.vars.example packages/worker/.dev.vars
            - name: Install dependencies
              run: npm ci
            - name: Build site
              run: npm run build --workspace=@project/site
            - name: Run `check`
              run: npm run check
