name: Code quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.2.2
      - name: Copy /packages/site/.env.example to /packages/site/.env
        run: cp packages/site/.env.example packages/site/.env && cp packages/worker/.dev.vars.example packages/worker/.dev.vars
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build --workspace=@project/site
      - name: Run Biome
        run: biome ci ./
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "npm"
      - name: Run `check`
        run: npm run check
